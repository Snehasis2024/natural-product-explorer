name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npx vite build
        working-directory: frontend

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium && npx vite build
        working-directory: frontend
      - name: Start API and preview server
        run: |
          (cd backend && uvicorn app.main:app --port 8000 &)
          (cd frontend && npx vite preview --port 4173 --strictPort &)
          for i in $(seq 1 60); do curl -fsS localhost:4173/api/health && break; sleep 2; done
      - run: npx playwright test
        working-directory: frontend
        env: { E2E_BASE_URL: 'http://localhost:4173' }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only/' .env
      - run: docker compose build
