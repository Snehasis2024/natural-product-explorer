# Natural Product Explorer — full stack
#   docker compose up --build        → http://localhost:8080  (API docs: http://localhost:8080/api/docs via backend :8000/docs)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-npexplorer}
      POSTGRES_USER: ${POSTGRES_USER:-npe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-npe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-npexplorer}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ENGINE: auto
        VITE_API_URL: ""
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "8080:80"

volumes:
  pgdata:
