server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 256k;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml chemical/x-mdl-molfile;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # default mime.types already maps .wasm → application/wasm; only molfiles need a type
  location ~ \.mol$ { default_type chemical/x-mdl-molfile; }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
