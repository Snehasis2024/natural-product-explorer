name: Deploy static site to GitHub Pages
# Builds the browser-only app and publishes it to the `gh-pages` branch.
# One-time setup: Settings → Pages → Source "Deploy from a branch" → Branch "gh-pages" / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      # Static hosting has no API: build with the in-browser RDKit.js engine.
      - run: npx vite build && touch dist/.nojekyll
        working-directory: frontend
        env: { VITE_ENGINE: browser }
      - name: Publish to gh-pages
        working-directory: frontend/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
